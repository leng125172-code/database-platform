name: database-platform-postgres

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: database-platform-postgres
    hostname: postgres
    restart: unless-stopped
    labels:
      io.whaledeck.resource-id: database-platform.postgres
      io.whaledeck.protected: "true"
      io.whaledeck.protection-level: CriticalData
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=peer --data-checksums
      PGDATA: /var/lib/postgresql/18/docker
      TZ: ${TZ}
      PGTZ: ${TZ}
    command:
      - postgres
      - -c
      - shared_buffers=8GB
      - -c
      - effective_cache_size=24GB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_connections=200
      - -c
      - max_wal_size=8GB
      - -c
      - wal_compression=on
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - password_encryption=scram-sha-256
      - -c
      - timezone=Asia/Shanghai
      - -c
      - log_timezone=Asia/Shanghai
      - -c
      - log_min_duration_statement=-1
    volumes:
      - ${NVME_DATA_ROOT}/postgres/data:/var/lib/postgresql
      - ${HDD_DATA_ROOT}/postgres/backup:/backup
    cpus: ${POSTGRES_CPU_LIMIT}
    mem_limit: ${POSTGRES_MEMORY_LIMIT}
    shm_size: 2gb
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"
        compress: "true"
    networks:
      - backend

networks:
  backend:
    name: database-platform-db-postgres
    internal: true
