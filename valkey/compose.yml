name: database-platform-valkey

services:
  valkey:
    image: ${VALKEY_IMAGE}
    container_name: database-platform-valkey
    hostname: valkey
    restart: unless-stopped
    labels:
      io.whaledeck.resource-id: database-platform.valkey
      io.whaledeck.protected: "true"
      io.whaledeck.protection-level: CriticalData
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
      TZ: ${TZ}
    command:
      - /bin/sh
      - -ec
      - if ! grep -q '^user default ' /data/users.acl 2>/dev/null; then printf 'user default on >%s ~* &* +@all\n' "$$VALKEY_PASSWORD" > /data/users.acl; fi; chmod 0600 /data/users.acl; exec valkey-server --bind 0.0.0.0 --protected-mode yes --aclfile /data/users.acl --appendonly yes --appendfsync everysec --aof-use-rdb-preamble yes --auto-aof-rewrite-percentage 100 --auto-aof-rewrite-min-size 64mb --save 900 1 --save 300 10 --maxmemory "${VALKEY_MAXMEMORY}" --maxmemory-policy noeviction
    volumes:
      - ${NVME_DATA_ROOT}/valkey/data:/data
      - ${HDD_DATA_ROOT}/valkey/backup:/backup
    cpus: ${VALKEY_CPU_LIMIT}
    mem_limit: ${VALKEY_MEMORY_LIMIT}
    sysctls:
      net.core.somaxconn: 1024
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$VALKEY_PASSWORD\" ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "5"
        compress: "true"
    networks:
      - backend

networks:
  backend:
    name: database-platform-cache-general
    internal: true
